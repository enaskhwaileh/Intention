version: "1.1.0"
evidence_access:
  retrieval_table_evidence_v1:
    version: "1.0.0"
    allowed_components: [title, description, column_names, row_structure, cell_values]
    forbidden_components:
      [metadata, capability_profiles, grounded_action, action_arguments,
       full_user_input, gold_labels, usefulness_labels]
candidate_depth:
  default: 20
  final_status: development_selection_pending
  development: [5, 10, 20, 50]
  sensitivity: [5, 10, 20, 50, 100]
  selection_rule:
    split: development_only
    metric: useful_candidate_recall
    minimum_recall: 0.95
    maximum_next_depth_gain: 0.01
    choice: smallest_qualifying_k
    test_labels_permitted: false
score_normalizations:
  bm25_query_max_v1:
    version: "1.0.0"
    method: query_max
    fit_scope: query_local
    calibration_data: none
    future_calibration_fit_scope: development_only
    test_labels_permitted: false
    formula: raw_score / max_query_raw_score; all_zero_maps_to_zero
serializations:
  title_description_schema_v1:
    version: "1.0.0"
    evidence_policy: retrieval_table_evidence_v1
    visible_components: [title, description, column_names]
    excluded_components: [row_structure, cell_values, metadata, capability_profiles, grounded_action, action_arguments, full_user_input, gold_labels, usefulness_labels]
    column_policy: first_row_insertion_order
    format: ordered_space_join
input_scopes:
  topical_only:
    query_field: topical_query
    permits_full_user_input: false
  full_input_baseline:
    query_field: full_user_input
    permits_full_user_input: true
