registry_version: "1.0.0"
predicate_registry_version: "1.0.0"
actions:
  compare:
    description: Compare an observable measure across a dimension or groups.
    required_arguments: [measure, comparison_dimension]
    optional_arguments: [geographic_scope, temporal_scope]
    grounding_failure_conditions: [missing_measure, missing_comparison_dimension]
    requirements:
      required:
        - {predicate: content.comparable_measure.v1, expected_from: measure, weight: 0.30}
        - {predicate: structure.grouping_dimension.v1, expected_from: comparison_dimension, weight: 0.30}
        - {predicate: structure.observation_granularity.v1, expected: compatible, weight: 0.25}
        - {predicate: scope.geographic_coverage.v1, expected_from: geographic_scope, conditional: true, weight: 0.15}
      optional:
        - {predicate: quality.normalized_units.v1, expected: true, weight: 0.40}
        - {predicate: quality.population_denominator.v1, expected: true, weight: 0.30}
        - {predicate: structure.repeated_observations.v1, expected: true, weight: 0.30}
      negative: []
  aggregate:
    description: Aggregate an observable measure, optionally by requested groups.
    required_arguments: [measure]
    optional_arguments: [grouping_dimension, geographic_scope, temporal_scope]
    grounding_failure_conditions: [missing_measure]
    requirements:
      required:
        - {predicate: content.aggregatable_measure.v1, expected_from: measure, weight: 0.55}
        - {predicate: structure.observation_granularity.v1, expected: aggregation_compatible, weight: 0.30}
        - {predicate: structure.grouping_dimension.v1, expected_from: grouping_dimension, conditional: true, weight: 0.15}
      optional:
        - {predicate: quality.normalized_units.v1, expected: true, weight: 0.50}
        - {predicate: quality.missingness.v1, operator: at_most, expected: 0.20, weight: 0.50}
      negative: []
  predict:
    description: Assess whether observed data can support predictive modelling without promising accuracy.
    required_arguments: [outcome, observational_unit]
    optional_arguments: [temporal_scope]
    grounding_failure_conditions: [missing_outcome, missing_observational_unit]
    requirements:
      required:
        - {predicate: content.observed_outcome.v1, expected_from: outcome, weight: 0.35}
        - {predicate: structure.observation_granularity.v1, expected_from: observational_unit, weight: 0.25}
        - {predicate: structure.usable_attributes.v1, expected: non_identifier, weight: 0.20}
        - {predicate: quality.outcome_variation.v1, expected: true, weight: 0.20}
      optional:
        - {predicate: quality.record_count.v1, operator: at_least, expected: 30, weight: 0.50}
        - {predicate: quality.missingness.v1, operator: at_most, expected: 0.20, weight: 0.50}
      negative:
        - {predicate: analysis.identifier_only_attributes.v1, expected: true, weight: 1.0}
  explain:
    description: Support exploratory association analysis without asserting causal identification.
    required_arguments: [outcome]
    optional_arguments: [geographic_scope, temporal_scope]
    grounding_failure_conditions: [missing_outcome]
    requirements:
      required:
        - {predicate: content.observed_outcome.v1, expected_from: outcome, weight: 0.40}
        - {predicate: analysis.explanatory_variables.v1, expected: observable, weight: 0.35}
        - {predicate: quality.outcome_variation.v1, expected: true, weight: 0.25}
      optional:
        - {predicate: quality.record_count.v1, operator: at_least, expected: 30, weight: 0.50}
        - {predicate: quality.missingness.v1, operator: at_most, expected: 0.20, weight: 0.50}
      negative: []
  monitor:
    description: Monitor a measure or event through repeated temporal observations.
    required_arguments: [measure, temporal_granularity]
    optional_arguments: [geographic_scope, temporal_scope]
    grounding_failure_conditions: [missing_measure, missing_temporal_granularity]
    requirements:
      required:
        - {predicate: content.monitored_measure.v1, expected_from: measure, weight: 0.35}
        - {predicate: scope.temporal_granularity.v1, expected_from: temporal_granularity, weight: 0.30}
        - {predicate: structure.repeated_observations.v1, expected: true, weight: 0.35}
      optional:
        - {predicate: scope.temporal_coverage.v1, expected_from: temporal_scope, conditional: true, weight: 0.50}
        - {predicate: quality.missingness.v1, operator: at_most, expected: 0.20, weight: 0.50}
      negative: []
