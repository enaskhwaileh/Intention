version: "1.0.0"
authoritative_tables: {format: parquet, layout: "artifacts/tables/{dataset_version}/{table_id}.parquet", analytical_engine: duckdb}
authoritative_profiles: {formats: [parquet, json], layout: "artifacts/profiles/{profile_version}/{table_id}.json"}
vector_index:
  provider: qdrant
  role: rebuildable_index_not_authority
  dense_vector_name: topical_dense
  future_sparse_vector_name: topical_sparse
  metric: cosine
  collection_identity_fields: [collection_version, encoder_hash, serialization_hash, dataset_version]
manifest: {version: "1.0.0", schema: configs/architecture/artifact_manifest_schema.json}
