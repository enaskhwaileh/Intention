name: deterministic-verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate retrieval result schema
        run: python -m json.tool configs/retrieval/result_schema.json > /dev/null
      - name: Deterministic command verification
        run: |
          python -m intention smoke
          python -m intention synthetic-benchmark
          python -m intention evaluate-profiler
          python -m intention evaluate-interpreter
          python -m intention evaluate-controlled
          python -m intention operational-smoke
          python -m intention audit-wikitables-source
          python -m intention preflight-wikitables-corpus
          python -m intention acquire-wikitables-corpus --data-root /tmp/intention-ci-no-network
          python -m intention demo-snapshot --check
