name: deterministic-verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (no optional live SDK)
        run: python -m pip install -e '.[dev]'
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Compile current implementation
        run: python -m compileall -q intention_grounding tests
      - name: Offline pipeline integration demonstration
        run: python -m intention_grounding.cli --mode offline --output outputs/ci-pipeline
      - name: Manually authored replay demonstration
        run: python -m intention_grounding.interpreter.demo
      - name: Canonical terminology
        run: python -m intention_grounding.terminology
