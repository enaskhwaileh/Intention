[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intention-grounding"
version = "0.1.0"
description = "Validated interpretation boundary for intended-action grounding"
requires-python = ">=3.10"
dependencies = ["jsonschema==4.23.0"]

[project.optional-dependencies]
groq = ["groq>=0.11,<1"]
dev = [] # Tests use the Python standard library.

[tool.setuptools.packages.find]
include = ["intention_grounding.interpreter*"]

[tool.setuptools.package-data]
"intention_grounding.interpreter" = ["schema.json", "fixtures/*.json"]
