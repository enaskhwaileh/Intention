[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intention-grounding"
version = "1.0.0"
description = "Intention grounding for dataset discovery: Interpreter, Intention Library, Grounder, Context matching, Table Profiler, Aligner"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
sbert = ["sentence-transformers>=3.0", "torch>=2.2", "chromadb>=0.5"]
faiss = ["faiss-cpu>=1.8"]
notebook = ["notebook>=7,<8", "ipykernel>=6.29,<8"]

[project.scripts]
intention-grounding = "intention_grounding.cli:main"
ig-experiments = "intention_grounding.experiments:main"

[tool.setuptools.packages.find]
include = ["intention_grounding*"]

[tool.setuptools.package-data]
"intention_grounding" = ["library/*.json", "resources/*.json"]
