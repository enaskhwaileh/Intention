[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intended-action-grounding"
version = "0.1.0"
description = "Deterministic MVP for intended-action-aware dataset ranking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "jupyter>=1", "nbconvert>=7", "ipykernel>=6"]
evaluation = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pyarrow>=15"]
operational = ["sentence-transformers>=2.7", "transformers>=4.51", "qdrant-client>=1.15", "pyarrow>=15", "duckdb>=1.1"]

[project.scripts]
intention = "intention.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
