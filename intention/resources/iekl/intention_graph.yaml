intentions:
  compare:
    goal: Compare entities, groups, or populations over shared measures.
    requires:
      - has_compared_entities
      - has_grouping_variable
      - has_comparable_measure
      - has_compatible_granularity
    optional_requires:
      - has_geographic_coverage
      - has_temporal_coverage
      - has_normalization_variable
    penalizes:
      - only_single_entity
      - no_comparable_measure
      - incompatible_granularity
  predict:
    goal: Predict or forecast an outcome from instance-level predictors.
    requires:
      - has_instance_level_records
      - has_target_variable
      - has_predictor_variables
      - has_row_level_variation
    optional_requires:
      - has_temporal_coverage
      - has_compatible_granularity
    penalizes:
      - only_aggregated_summary
      - no_target_variable
      - no_predictor_variables
  explain:
    goal: Explain why an outcome varies across entities, groups, or contexts.
    requires:
      - has_outcome_variable
      - has_explanatory_variables
      - has_contextual_variables
    optional_requires:
      - has_temporal_coverage
      - has_compatible_granularity
    penalizes:
      - only_descriptive_counts
      - no_explanatory_signal
  aggregate:
    goal: Aggregate records by a grouping variable and measure.
    requires:
      - has_aggregatable_measure
      - has_grouping_variable
      - has_multiple_records
    optional_requires:
      - has_temporal_coverage
      - has_geographic_coverage
    penalizes:
      - no_numeric_or_countable_measure
      - only_textual_description
  integrate:
    goal: Integrate datasets through shared entities, schema overlap, and consistent units.
    requires:
      - has_join_key
      - has_schema_overlap
      - has_unit_consistency
      - has_shared_entity
    optional_requires:
      - has_geographic_coverage
      - has_temporal_coverage
    penalizes:
      - no_linking_key
      - incompatible_units
      - ambiguous_entities

predicates:
  has_compared_entities:
    axis: semantic
    definition: Data identifies two or more entities, cohorts, or groups to compare.
    testable_from: [semantic, structural]
  has_grouping_variable:
    axis: semantic
    definition: Data contains a field that can group records into meaningful categories.
    testable_from: [semantic, structural]
  has_comparable_measure:
    axis: semantic
    definition: Data contains a measure that can be compared across groups.
    testable_from: [semantic, structural, quality]
  has_compatible_granularity:
    axis: structural
    definition: Records or measures are available at compatible units of analysis.
    testable_from: [structural, coverage]
  has_geographic_coverage:
    axis: coverage
    definition: Data includes geographic scope relevant to the user intent.
    testable_from: [coverage, semantic]
  has_temporal_coverage:
    axis: coverage
    definition: Data includes time coverage relevant to the user intent.
    testable_from: [coverage, structural]
  has_normalization_variable:
    axis: semantic
    definition: Data includes a denominator or control variable for normalized comparisons.
    testable_from: [semantic, structural]
  has_instance_level_records:
    axis: structural
    definition: Data contains row-level observations rather than only summaries.
    testable_from: [structural]
  has_target_variable:
    axis: semantic
    definition: Data contains the outcome variable to be predicted.
    testable_from: [semantic, structural]
  has_predictor_variables:
    axis: semantic
    definition: Data contains candidate input variables for prediction.
    testable_from: [semantic, structural, behavioral]
  has_row_level_variation:
    axis: quality
    definition: Data contains sufficient variation across rows for predictive modeling.
    testable_from: [quality, structural]
  has_outcome_variable:
    axis: semantic
    definition: Data contains the outcome whose variation should be explained.
    testable_from: [semantic, structural]
  has_explanatory_variables:
    axis: semantic
    definition: Data contains variables that may explain the outcome.
    testable_from: [semantic, structural]
  has_contextual_variables:
    axis: semantic
    definition: Data contains contextual variables relevant to interpretation.
    testable_from: [semantic, coverage]
  has_aggregatable_measure:
    axis: semantic
    definition: Data contains a numeric or countable measure suitable for aggregation.
    testable_from: [semantic, structural, quality]
  has_multiple_records:
    axis: structural
    definition: Data contains multiple records that can be aggregated.
    testable_from: [structural]
  has_join_key:
    axis: structural
    definition: Data contains keys or identifiers usable for joins.
    testable_from: [structural, semantic]
  has_schema_overlap:
    axis: semantic
    definition: Data schemas contain overlapping concepts or compatible fields.
    testable_from: [semantic, structural]
  has_unit_consistency:
    axis: quality
    definition: Data uses compatible units or provides enough metadata to align units.
    testable_from: [quality, semantic]
  has_shared_entity:
    axis: semantic
    definition: Data sources refer to at least one shared entity type.
    testable_from: [semantic, coverage]
